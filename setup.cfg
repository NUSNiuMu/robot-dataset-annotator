[metadata]
name = robot-dataset-annotator
version = 0.1.0
description = Task-pluggable robot dataset segmentation, review, and validation
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    numpy>=1.23
include_package_data = True

[options.packages.find]
where = src
exclude =
    tests
    tests.*

[options.package_data]
robot_dataset_annotator =
    task_specs/*.json

[options.extras_require]
insight =
    opencv-python>=4.8
    pyarrow>=12
    scipy>=1.10
visualization =
    matplotlib>=3.5
lerobot =
    lerobot==0.4.4
dev =
    pytest>=7
    ruff>=0.6

[options.entry_points]
console_scripts =
    rda = robot_dataset_annotator.cli:main
